<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600&family=Work+Sans:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .card {
      font-family: 'Work Sans', system-ui, sans-serif;
      background: oklch(99% 0.004 80);
      border: 1px solid oklch(88% 0.02 70);
      border-radius: 3px;
      overflow: hidden;
      display: flex; flex-direction: column;
      height: 100%;
      transition: transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .45s ease, border-color .45s ease;
    }
    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 22px 40px -18px oklch(24% 0.02 40 / 0.35);
      border-color: oklch(56% 0.15 40 / 0.4);
    }
    .art-box { width: 100%; aspect-ratio: 1 / 1; position: relative; overflow: hidden; }
    .art-inner { width: 100%; height: 100%; transition: transform .7s cubic-bezier(.2,.8,.2,1); }
    .card:hover .art-inner { transform: scale(1.09) rotate(-0.6deg); }
    .art-box::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 55%, oklch(24% 0.02 40 / 0.28) 100%);
      opacity: 0; transition: opacity .45s ease;
    }
    .card:hover .art-box::after { opacity: 1; }
    .cat-tag {
      position: absolute; top: 12px; left: 12px;
      background: oklch(99% 0.004 80 / 0.9); color: oklch(38% 0.02 45);
      font-size: 10px; letter-spacing: 1px; padding: 4px 9px; border-radius: 20px;
      transition: transform .4s ease;
    }
    .card:hover .cat-tag { transform: translateY(-2px); }
    .card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 4px; flex-grow: 1; }
    .title { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 19px; color: oklch(24% 0.02 40); }
    .artist { font-size: 12.5px; color: oklch(50% 0.03 45); }
    .row-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
    .price { font-size: 15px; font-weight: 600; color: oklch(56% 0.15 40); }
    .btn {
      font-size: 12px; font-weight: 600; letter-spacing: 0.3px; color: oklch(99% 0.004 80);
      background: oklch(24% 0.02 40); padding: 8px 14px; border-radius: 3px; text-decoration: none;
      display: inline-block; transition: background .35s ease, transform .35s ease;
    }
    .btn:hover { background: oklch(56% 0.15 40); transform: translateX(2px); }
  </style>
</helmet>
<div class="card">
  <div class="art-box">
    <div class="art-inner">
      <dc-import name="PaintingArt" variant="{{variant}}" hint-size="100%,100%"></dc-import>
    </div>
    <div class="cat-tag">{{category}}</div>
  </div>
  <div class="card-body">
    <div class="title">{{title}}</div>
    <div class="artist">by {{artist}}</div>
    <div class="row-bottom">
      <span class="price">{{price}}</span>
      <a class="btn" href="#">Inquire</a>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{
  "variant": {"editor": null, "default": "arch"},
  "category": {"editor": "text", "default": "Historical"},
  "title": {"editor": "text", "default": "Registon at Dusk"},
  "artist": {"editor": "text", "default": "Dilnoza Yusupova"},
  "price": {"editor": "text", "default": "$420"}
}'>
class Component extends DCLogic {
  renderVals() {
    return {
      variant: this.props.variant ?? 'arch',
      category: this.props.category ?? 'Historical',
      title: this.props.title ?? 'Registon at Dusk',
      artist: this.props.artist ?? 'Dilnoza Yusupova',
      price: this.props.price ?? '$420',
    };
  }
}
</script>
</body>
</html>
