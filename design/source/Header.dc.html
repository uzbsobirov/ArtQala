<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .hdr {
      font-family: 'Work Sans', system-ui, sans-serif;
      display: flex; align-items: center; justify-content: space-between;
      padding: 22px 56px;
      background: oklch(97% 0.012 75);
      border-bottom: 1px solid oklch(88% 0.02 70);
    }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    @keyframes logoGlow {
      0%, 100% { filter: drop-shadow(0 0 0 oklch(78% 0.15 85 / 0)); }
      50% { filter: drop-shadow(0 2px 10px oklch(78% 0.15 85 / 0.55)); }
    }
    .brand-mark { height: 46px; width: auto; display: block; transition: transform .6s cubic-bezier(.2,.8,.2,1); animation: logoGlow 4.5s ease-in-out infinite; }
    .brand:hover .brand-mark { transform: scale(1.06) rotate(-2deg); }
    .brand-text { display: flex; flex-direction: column; line-height: 1; }
    .brand-name {
      font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 22px;
      letter-spacing: 1px; color: oklch(24% 0.02 40);
    }
    .brand-sub { font-size: 9.5px; letter-spacing: 3px; color: oklch(56% 0.15 40); margin-top: 3px; }
    .nav { display: flex; align-items: center; gap: 36px; }
    .nav-link {
      position: relative;
      font-size: 14px; font-weight: 500; color: oklch(38% 0.02 45); text-decoration: none;
      padding-bottom: 4px;
    }
    .nav-link::after {
      content: ""; position: absolute; left: 0; right: 100%; bottom: -2px; height: 2px;
      background: oklch(56% 0.15 40); transition: right .35s cubic-bezier(.2,.8,.2,1);
    }
    .nav-link:hover { color: oklch(56% 0.15 40); }
    .nav-link:hover::after { right: 0; }
    .nav-link.active { color: oklch(56% 0.15 40); }
    .nav-link.active::after { right: 0; }
    .langs { display: flex; align-items: center; gap: 6px; margin-left: 8px; }
    .lang-pill {
      font-size: 11px; font-weight: 600; letter-spacing: 0.5px; padding: 5px 10px; border-radius: 20px;
      color: oklch(38% 0.02 45); background: transparent; border: 1px solid oklch(88% 0.02 70);
      transition: background .3s ease, color .3s ease, border-color .3s ease;
    }
    .lang-pill:hover { border-color: oklch(56% 0.15 40); color: oklch(56% 0.15 40); }
    .lang-pill.active { background: oklch(56% 0.15 40); color: oklch(99% 0.004 80); border-color: oklch(56% 0.15 40); }
    .currency-select {
      font-family: 'Work Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
      padding: 5px 8px; border-radius: 20px; color: oklch(38% 0.02 45); background: transparent;
      border: 1px solid oklch(88% 0.02 70); margin-left: 10px; transition: border-color .3s ease, color .3s ease;
    }
    .currency-select:hover { border-color: oklch(62% 0.08 200); color: oklch(62% 0.08 200); }
    a { color: oklch(56% 0.15 40); }
    a:hover { color: oklch(46% 0.15 38); }
  </style>
</helmet>
<div class="hdr">
  <a class="brand" href="#">
    <img class="brand-mark" src="logo.png" alt="Art Qala">
    <span class="brand-text">
      <span class="brand-sub" style="margin-top: 0;">GALLERY &amp; STUDIO</span>
    </span>
  </a>
  <nav class="nav">
    <a class="nav-link {{homeActive}}" href="#">Home</a>
    <a class="nav-link {{galleryActive}}" href="#">Gallery</a>
    <a class="nav-link {{artistsActive}}" href="#">Artists</a>
    <a class="nav-link {{servicesActive}}" href="#">Services</a>
    <a class="nav-link {{contactActive}}" href="#">Contact</a>
    <div class="langs">
      <span class="lang-pill active">EN</span>
      <span class="lang-pill">RU</span>
      <span class="lang-pill">UZ</span>
      <select class="currency-select">
        <option>$ USD</option>
        <option>so'm UZS</option>
        <option>₽ RUB</option>
        <option>€ EUR</option>
      </select>
    </div>
  </nav>
</div>
</x-dc>
<script data-dc-script data-props='{"active":{"editor":"enum","options":["home","gallery","artists","services","contact"],"default":"home"}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const cls = (name) => (active === name ? 'active' : '');
    return {
      homeActive: cls('home'),
      galleryActive: cls('gallery'),
      artistsActive: cls('artists'),
      servicesActive: cls('services'),
      contactActive: cls('contact'),
    };
  }
}
</script>
</body>
</html>
